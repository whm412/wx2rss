name: 故障报告
description: 报告部署、登录、抓取、RSS 或告警问题
title: "[Bug] "
labels: ["bug", "待确认"]
body:
  - type: markdown
    attributes:
      value: 请先删除 Token、Cookie、激活码、Webhook、数据库和完整机器码。
  - type: input
    id: version
    attributes:
      label: wx2rss 版本与镜像地址
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统、CPU 架构与 Docker 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      description: 请附问题时间前后约 50 行，并说明是否刚启动、唤醒或切换网络。
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除所有 Token、Cookie、激活码、Webhook、数据库和完整机器码
          required: true
