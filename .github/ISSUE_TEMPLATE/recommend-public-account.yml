name: 推荐免费公众号
description: 推荐一个公众号加入 wx2rss 免费订阅列表
title: "[公众号推荐] "
body:
  - type: markdown
    attributes:
      value: |
        感谢推荐。提交后由维护者人工核对，符合条件也会分批启用，不承诺立即收录。
        请勿填写 Cookie、Token、登录截图、数据库或任何账号凭据。
  - type: input
    id: name
    attributes:
      label: 公众号名称
      placeholder: 请填写微信中显示的完整名称
    validations:
      required: true
  - type: input
    id: article_url
    attributes:
      label: 公开文章链接
      description: 请提供至少一篇该公众号发布的 mp.weixin.qq.com 文章链接，用于核对身份和数字 ID。
      placeholder: https://mp.weixin.qq.com/s/...
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 推荐理由
      description: 请简要说明主要内容、适合哪些读者，以及为什么值得长期订阅。
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: 大致更新频率
      options:
        - 每天或几乎每天
        - 每周数次
        - 每周一次左右
        - 每月数次
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我确认链接来自被推荐公众号，而不是转载页或第三方聚合页。
          required: true
        - label: 我没有在本 Issue 中提交任何 Cookie、Token、登录凭据或私人数据。
          required: true
        - label: 我理解推荐需人工审核，且可能不收录或延后启用。
          required: true
